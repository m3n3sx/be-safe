name: alertmap
description: Community-driven safety alert system

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.6.1
  google_sign_in: ^6.2.1
  flutter_contacts: ^1.1.9+2
  dynamic_color: ^1.7.0
  sentry_flutter: ^8.14.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  battery_plus: ^6.1.0
  geolocator: ^12.0.0
  provider: ^6.1.2
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

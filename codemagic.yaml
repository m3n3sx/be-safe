workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pl.u235.alertmap"
      groups:
        - sentry  # SENTRY_DSN secret z Codemagic UI (Settings → Variables → group "sentry")
        - google_maps  # GOOGLE_MAPS_IOS_API_KEY (Secure) — patrz docs/GOOGLE_MAPS_KEYS.md
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set Flutter version
        script: flutter --version

      - name: Flutter packages
        working_directory: mobile
        script: |
          flutter pub get

      - name: Generate iOS files (flutter precache)
        working_directory: mobile
        script: |
          # Tworzy ios/Podfile, ios/Runner/GeneratedPluginRegistrant.* etc.
          flutter precache --ios
          # Wymusza generację Podfile poprzez no-op build (config only)
          flutter build ios --config-only --no-codesign || true

      - name: Force iOS 14.0 deployment target in Podfile
        working_directory: mobile/ios
        script: |
          # Projekt (pbxproj) i ten Podfile są na 14.0.
          # Firebase 11 wymaga 14. mobile_scanner 7.0.1 używa Vision i sam deklaruje 12,
          # więc nie podnosimy platformy do 15.5 (to byłby MLKit 7 ze skanera 6).
          if [ -f Podfile ]; then
            # Odkomentuj/zamień linię platform
            sed -i.bak -E "s/# *platform :ios.*/platform :ios, '14.0'/" Podfile
            sed -i.bak -E "s/platform :ios, '[0-9.]+'/platform :ios, '14.0'/" Podfile
            # Jeśli linia nie istnieje wcale, dodaj na początku
            if ! grep -q "^platform :ios" Podfile; then
              sed -i.bak "1i platform :ios, '14.0'" Podfile
            fi
            echo "===== Podfile content ====="
            head -10 Podfile
            echo "==========================="
          else
            echo "ERROR: Podfile not generated by flutter precache"
            exit 1
          fi

      - name: Install CocoaPods
        working_directory: mobile/ios
        script: |
          pod repo update
          pod install --repo-update

      - name: Google Maps iOS key → Secrets.xcconfig
        working_directory: mobile/ios
        script: |
          # Klucz z secure env var (grupa google_maps); nie wypisujemy wartości.
          if [ -n "${GOOGLE_MAPS_IOS_API_KEY:-}" ]; then
            printf 'GOOGLE_MAPS_IOS_API_KEY=%s\n' "$GOOGLE_MAPS_IOS_API_KEY" > Flutter/Secrets.xcconfig
            echo "Secrets.xcconfig written (GOOGLE_MAPS_IOS_API_KEY set)"
          else
            echo "WARNING: GOOGLE_MAPS_IOS_API_KEY not set — Google Maps on iOS will be blank"
          fi

      - name: Build iOS (unsigned, no codesign)
        working_directory: mobile
        script: |
          # KRYTYCZNE: --no-tree-shake-icons bo Canvas markery używają dynamicznych IconData
          flutter build ios --release --no-codesign \
            --no-tree-shake-icons \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Package as IPA (unsigned)
        working_directory: mobile/build/ios/iphoneos
        script: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr AlertMap-unsigned.ipa Payload
          ls -lh AlertMap-unsigned.ipa
          echo "IPA size: $(du -h AlertMap-unsigned.ipa | cut -f1)"

    artifacts:
      - mobile/build/ios/iphoneos/AlertMap-unsigned.ipa
      - mobile/build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - meneswczesny@gmail.com
        notify:
          success: true
          failure: true

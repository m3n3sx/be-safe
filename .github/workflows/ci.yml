# CI: testy backendu + build Androida (debug APK) przy każdym pushu i PR.
# Nic nie wdraża na serwery. iOS buduje Codemagic (codemagic.yaml).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — testy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  android:
    name: Android — debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: google-services.json (z sekretu albo atrapa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          f=mobile/android/app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$f"
            echo "Użyto google-services.json z sekretu."
          else
            # Atrapa tylko po to, żeby wtyczka Google Services przeszła build.
            # Firebase (logowanie Google, push) w takim APK nie zadziała.
            cat > "$f" <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "pl.u235.alertmap"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::Brak sekretu GOOGLE_SERVICES_JSON — użyto atrapy (Firebase nie działa w tym APK)."
          fi

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # --no-tree-shake-icons KRYTYCZNE: markery na mapie używają dynamicznych IconData
        run: flutter build apk --debug --no-tree-shake-icons --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: besafe-debug-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

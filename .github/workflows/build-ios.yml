name: Build iOS (unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Set iOS platform in Podfile to 14.0
        working-directory: mobile/ios
        run: |
          if [ -f Podfile ]; then
            # Odkomentuj i ustaw wersję platformy na 14.0 (firebase_* wymaga ≥13)
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile || true
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile || true
            echo "=== Podfile po modyfikacji ==="
            head -20 Podfile
          else
            echo "Podfile not found after flutter pub get — iOS platform nie wygenerowany?"
            ls -la
            exit 1
          fi

      - name: (Optional) Setup GoogleService-Info.plist for iOS Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist zainstalowany."
          else
            echo "Brak secret GOOGLE_SERVICE_INFO_PLIST — build iOS bez FCM (działa, tylko bez push)."
          fi

      - name: CocoaPods install
        working-directory: mobile/ios
        run: |
          pod repo update
          pod install --verbose

      - name: Build iOS (unsigned, release)
        working-directory: mobile
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build ios --release --no-codesign --dart-define=SENTRY_DSN=${SENTRY_DSN:-}

      - name: Package as IPA (unsigned)
        working-directory: mobile/build/ios/iphoneos
        run: |
          if [ ! -d Runner.app ]; then
            echo "ERROR: Runner.app nie istnieje"
            ls -la
            exit 1
          fi
          # IPA = zip(Payload/Runner.app). Wymaga podpisania na Twojej maszynie (sideloader/AltStore).
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr AlertMap-unsigned.ipa Payload
          ls -lh AlertMap-unsigned.ipa
          rm -rf Payload

      - name: Upload unsigned IPA (sign locally with sideloader/AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: beSafe-ios-ipa
          path: mobile/build/ios/iphoneos/AlertMap-unsigned.ipa
          retention-days: 1
          compression-level: 0  # IPA juz jest zip

      - name: Summary
        run: |
          echo "## Build iOS unsigned — zakończony ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artefakt: **beSafe-ios-ipa** (AlertMap-unsigned.ipa, retention 1 dzień)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Instalacja na Linux (Fedora):" >> $GITHUB_STEP_SUMMARY
          echo "1. \`gh run download $GITHUB_RUN_ID -n beSafe-ios-ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "2. \`bash mobile/scripts/install_ipa.sh AlertMap-unsigned.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Podaj Apple ID + hasło (app-specific). Działa 7 dni." >> $GITHUB_STEP_SUMMARY

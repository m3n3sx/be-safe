name: Build iOS (unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Set iOS platform in Podfile to 14.0
        working-directory: mobile/ios
        run: |
          if [ -f Podfile ]; then
            # Odkomentuj i ustaw wersję platformy na 14.0 (firebase_* wymaga ≥13)
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile || true
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile || true
            echo "=== Podfile po modyfikacji ==="
            head -20 Podfile
          else
            echo "Podfile not found after flutter pub get — iOS platform nie wygenerowany?"
            ls -la
            exit 1
          fi

      - name: (Optional) Setup GoogleService-Info.plist for iOS Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist zainstalowany."
          else
            echo "Brak secret GOOGLE_SERVICE_INFO_PLIST — build iOS bez FCM (działa, tylko bez push)."
          fi

      - name: CocoaPods install
        working-directory: mobile/ios
        run: |
          pod repo update
          pod install --verbose

      - name: Build iOS (unsigned, release)
        working-directory: mobile
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build ios --release --no-codesign --dart-define=SENTRY_DSN=${SENTRY_DSN:-}

      - name: Compress Runner.app (zstd, lowest size)
        working-directory: mobile/build/ios/iphoneos
        run: |
          if [ ! -d Runner.app ]; then
            echo "ERROR: Runner.app nie istnieje"
            ls -la
            exit 1
          fi
          # tar+zstd ~50% mniejsze niz zip GH Actions
          tar -cf - Runner.app | zstd -19 -T0 -o Runner.app.tar.zst
          ls -lh Runner.app.tar.zst

      - name: Upload Runner.app (for Appetize.io / resigning)
        uses: actions/upload-artifact@v4
        with:
          name: beSafe-ios-runner-app
          path: mobile/build/ios/iphoneos/Runner.app.tar.zst
          retention-days: 3
          compression-level: 0  # juz skompresowany zstd

      - name: Summary
        run: |
          echo "## Build iOS unsigned — zakończony ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artefakt: **beSafe-ios-runner-app** (Runner.app.tar.zst, retention 3 dni)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jak użyć:" >> $GITHUB_STEP_SUMMARY
          echo "1. Pobierz artefakt z sekcji Artifacts poniżej" >> $GITHUB_STEP_SUMMARY
          echo "2. \`unzip beSafe-ios-runner-app.zip && zstd -d Runner.app.tar.zst && tar -xf Runner.app.tar\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Appetize.io**: Upload Runner.app → emulator iPhone w przeglądarce" >> $GITHUB_STEP_SUMMARY
          echo "4. **Real iPhone**: podpisz \`codesign\` z Apple Developer cert, zapakuj w IPA, sideload" >> $GITHUB_STEP_SUMMARY

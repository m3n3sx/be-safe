name: Build & Deploy APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          fi

      - name: Setup release keystore (optional — needed for Play Store)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/upload-keystore.jks
            cat > mobile/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Keystore configured — builds will be signed for Play Store."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — builds will use debug signing."
          fi

      - name: Build APK & AAB
        working-directory: mobile
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter pub get
          # --no-tree-shake-icons KRYTYCZNE: Canvas markery używają dynamicznych IconData
          flutter build apk --release --no-tree-shake-icons --dart-define=SENTRY_DSN=$SENTRY_DSN
          flutter build appbundle --release --no-tree-shake-icons --dart-define=SENTRY_DSN=$SENTRY_DSN

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beSafe-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: beSafe-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Deploy to VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Upload APK do /home/ubuntu/besafe/backend/ (NIE alertmap!)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key \
            mobile/build/app/outputs/flutter-apk/app-release.apk \
            ubuntu@$VPS_HOST:/home/ubuntu/besafe/backend/AlertMap.apk
          # Bump version w backend/src/index.js + sync mobile update_service.dart
          # (double-source-of-truth wersji - oba MUSZĄ być w sync)
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key ubuntu@$VPS_HOST \
            "cd /home/ubuntu/besafe/backend && node -e \"
              const fs = require('fs');
              const f = 'src/index.js';
              let c = fs.readFileSync(f,'utf8');
              const m = c.match(/version: (\\d+)/);
              if(m) { const v = parseInt(m[1])+1; c = c.replace(/version: \\d+/, 'version: '+v); fs.writeFileSync(f,c); console.log('Backend version bumped to '+v); }
            \" && pm2 restart besafe-backend"

  deploy-backend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Sync całego backend/src/ do prod (NIE /home/ubuntu/alertmap/!)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key -r \
            backend/src/* ubuntu@$VPS_HOST:/home/ubuntu/besafe/backend/src/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key ubuntu@$VPS_HOST \
            "pm2 restart besafe-backend"

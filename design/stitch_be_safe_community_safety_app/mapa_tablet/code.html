<!DOCTYPE html>

<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System Bezpieczeństwa - Mapa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#002204",
                        "primary-container": "#e9003a",
                        "on-surface": "#1a1c1c",
                        "on-tertiary-fixed-variant": "#005047",
                        "outline": "#936e6d",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "on-primary-fixed": "#400009",
                        "secondary-fixed-dim": "#88d982",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed": "#ffdad9",
                        "on-surface-variant": "#5e3f3e",
                        "on-primary-fixed-variant": "#920021",
                        "on-secondary-fixed-variant": "#005312",
                        "surface-tint": "#bf002e",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#88f5e3",
                        "tertiary-container": "#008376",
                        "secondary-fixed": "#a3f69c",
                        "primary": "#ba002c",
                        "error": "#ba1a1a",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e8e8e8",
                        "secondary-container": "#a0f399",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2f3131",
                        "surface-bright": "#f9f9f9",
                        "tertiary-fixed-dim": "#6ad9c8",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#ffb3b3",
                        "on-tertiary-container": "#f4fffb",
                        "on-secondary-container": "#217128",
                        "tertiary": "#00685d",
                        "primary-fixed-dim": "#ffb3b3",
                        "on-tertiary-fixed": "#00201c",
                        "on-primary": "#ffffff",
                        "surface-container": "#eeeeee",
                        "background": "#f9f9f9",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary": "#1b6d24",
                        "on-primary-container": "#fffbff",
                        "surface-variant": "#e2e2e2",
                        "surface": "#f9f9f9",
                        "outline-variant": "#e8bcbb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-md": "12px",
                        "stack-lg": "24px",
                        "stack-sm": "4px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-lg h-screen overflow-hidden flex">
<!-- Navigation Rail (Left Column) -->
<nav class="w-[80px] h-full bg-surface-container-lowest border-r border-surface-variant flex flex-col items-center py-stack-lg z-20 shrink-0">
<!-- Brand Icon -->
<div aria-label="Logo" class="mb-stack-lg w-12 h-12 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-headline-lg">security</span>
</div>
<!-- Nav Items -->
<div class="flex flex-col gap-base w-full items-center">
<!-- Active Item: Mapa -->
<button aria-current="page" class="group flex flex-col items-center justify-center w-[56px] h-[56px] rounded-lg bg-primary-fixed text-on-primary-fixed-variant">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="text-[10px] font-label-lg mt-1">Mapa</span>
</button>
<!-- Alerty -->
<button class="group flex flex-col items-center justify-center w-[56px] h-[56px] rounded-lg text-on-surface-variant hover:bg-surface-container-low relative">
<div class="relative">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-error rounded-full border-2 border-surface-container-lowest"></span>
</div>
<span class="text-[10px] font-label-lg mt-1">Alerty</span>
</button>
<!-- SOS (Distinctive) -->
<button class="group flex flex-col items-center justify-center w-[56px] h-[56px] rounded-full bg-primary-container text-on-primary shadow-sm hover:bg-primary mt-stack-md mb-stack-md">
<span class="material-symbols-outlined text-[28px]" data-icon="sos">sos</span>
</button>
<!-- Rodzina -->
<button class="group flex flex-col items-center justify-center w-[56px] h-[56px] rounded-lg text-on-surface-variant hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="text-[10px] font-label-lg mt-1">Rodzina</span>
</button>
<!-- Profil -->
<button class="group flex flex-col items-center justify-center w-[56px] h-[56px] rounded-lg text-on-surface-variant hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-label-lg mt-1">Profil</span>
</button>
</div>
</nav>
<!-- Map Area (Center Column) -->
<main class="flex-1 relative h-full bg-surface-variant">
<!-- The Map Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A clean, modern top-down satellite view of an urban city map. The map uses a light-mode color palette with subtle greys, whites, and muted greens for parks, typical of professional navigation interfaces. The lighting is neutral and even, ensuring clarity. The overall aesthetic is functional, clear, and safe, perfectly suited as a background for a security application." data-location="Warszawa" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBVQyCnXJLyD9s7q8KKc_uaEemfSl87MMjbj0Y8hqR1A1Vji-gixzvWw7MqTul0PORMBtWUn379pEow0KQXg7tVIPyJb8bQSVEafzuZM9QF9TYizxv-z6x-C8SbJRqewQbAx33bLEyUieyMpRqIV9xPK5IcySLQflZaFxiZAzIMZE5a0Il4mjMIo9SHoPP1qX_iyd2rrkK712FBRezenappreBnLitDIQpjD3L0hYqTuyjOd6Z6UxRyH6sZly3USmLUdCAd6cYTGSw');"></div>
<!-- Floating Search Bar -->
<div class="absolute top-margin-desktop left-margin-desktop right-margin-desktop max-w-md mx-auto z-10">
<div class="flex items-center bg-surface-container-lowest rounded-full h-14 px-4 shadow-[0_4px_8px_rgba(0,0,0,0.1)] border border-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="search">search</span>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-lg text-on-surface placeholder-on-surface-variant p-0 outline-none" placeholder="Szukaj w okolicy..." type="text"/>
<div class="w-px h-6 bg-surface-variant mx-3"></div>
<button aria-label="Filters" class="text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</button>
</div>
</div>
<!-- Floating Action Button (FAB) -->
<button class="absolute bottom-margin-desktop right-margin-desktop flex items-center justify-center bg-primary text-on-primary rounded-full h-16 pl-5 pr-6 shadow-[0_8px_16px_rgba(186,26,26,0.2)] hover:shadow-[0_12px_24px_rgba(186,26,26,0.3)] transition-shadow z-10 gap-2">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
<span class="font-label-lg text-[14px]">Zgłoś</span>
</button>
</main>
<!-- Alerts Sidebar (Right Column) -->
<aside class="w-[320px] h-full bg-surface-container-lowest border-l border-surface-variant flex flex-col z-20 shrink-0">
<!-- Sidebar Header -->
<div class="p-margin-desktop border-b border-surface-variant bg-surface-container-lowest sticky top-0 z-10">
<h2 class="text-title-lg text-on-surface flex items-center justify-between">
                Alerty w okolicy 
                <span class="bg-error-container text-on-error-container text-label-lg px-2 py-0.5 rounded-full">12</span>
</h2>
</div>
<!-- Scrollable Alerts List -->
<div class="flex-1 overflow-y-auto p-gutter flex flex-col gap-stack-md bg-surface">
<!-- Alert Card 1 -->
<div class="bg-surface-container-lowest p-3 rounded-lg border border-surface-variant shadow-sm flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-error-container text-on-error-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="local_fire_department">local_fire_department</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<span class="text-label-lg text-error font-bold uppercase">Pożar</span>
<span class="text-[12px] text-on-surface-variant">Teraz</span>
</div>
<h3 class="text-body-md font-medium text-on-surface leading-tight mb-1 truncate">Zadymienie w centrum</h3>
<p class="text-body-md text-on-surface-variant text-[13px] flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="location_on">location_on</span>
                        200m stąd
                    </p>
</div>
</div>
<!-- Alert Card 2 -->
<div class="bg-surface-container-lowest p-3 rounded-lg border border-surface-variant shadow-sm flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="directions_car">directions_car</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<span class="text-label-lg text-primary font-bold uppercase">Wypadek</span>
<span class="text-[12px] text-on-surface-variant">5 min</span>
</div>
<h3 class="text-body-md font-medium text-on-surface leading-tight mb-1 truncate">Kolizja na skrzyżowaniu</h3>
<p class="text-body-md text-on-surface-variant text-[13px] flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="location_on">location_on</span>
                        450m stąd
                    </p>
</div>
</div>
<!-- Alert Card 3 -->
<div class="bg-surface-container-lowest p-3 rounded-lg border border-surface-variant shadow-sm flex items-start gap-3 opacity-80">
<div class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="thunderstorm">thunderstorm</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<span class="text-label-lg text-on-surface-variant font-bold uppercase">Pogoda</span>
<span class="text-[12px] text-on-surface-variant">1 godz</span>
</div>
<h3 class="text-body-md font-medium text-on-surface leading-tight mb-1 truncate">Ostrzeżenie przed burzą</h3>
<p class="text-body-md text-on-surface-variant text-[13px] flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="location_on">location_on</span>
                        Region
                    </p>
</div>
</div>
<!-- Load More -->
<button class="w-full py-2 mt-stack-sm text-primary text-label-lg border border-surface-variant rounded-lg hover:bg-surface-container-low">
                Załaduj starsze alerty
            </button>
</div>
</aside>
</body></html>

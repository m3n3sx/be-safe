<!DOCTYPE html>

<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zgłoś zagrożenie - be:Safe</title>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen flex flex-col shadow-xl">
<!-- Top App Bar (Task-Focused - No Main Nav Shells) -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center px-margin-mobile h-16 w-full z-40 sticky top-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Zgłoś zagrożenie</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-stack-lg flex flex-col gap-stack-lg overflow-y-auto">
<!-- Category Chips (Horizontal Scroll) -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-title-lg text-title-lg text-on-surface px-1">Kategoria</h2>
<div class="flex overflow-x-auto gap-stack-md pb-stack-sm scrollbar-hide -mx-margin-mobile px-margin-mobile snap-x snap-mandatory">
<!-- Selected Chip -->
<button class="flex flex-col items-center justify-center gap-stack-sm min-w-[88px] h-[88px] bg-primary-container text-on-primary-container rounded-[16px] snap-center shrink-0 border border-transparent shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-[28px] shrink-0" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-lg text-label-lg text-center break-words w-full px-1">Wypadek</span>
</button>
<!-- Unselected Chips -->
<button class="flex flex-col items-center justify-center gap-stack-sm min-w-[88px] h-[88px] bg-surface-container-low text-on-surface-variant border border-surface-variant rounded-[16px] snap-center shrink-0 hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] shrink-0">groups</span>
<span class="font-label-lg text-label-lg text-center break-words w-full px-1 leading-tight">Agresywne osoby</span>
</button>
<button class="flex flex-col items-center justify-center gap-stack-sm min-w-[88px] h-[88px] bg-surface-container-low text-on-surface-variant border border-surface-variant rounded-[16px] snap-center shrink-0 hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] shrink-0">front_hand</span>
<span class="font-label-lg text-label-lg text-center break-words w-full px-1">Kradzież</span>
</button>
<button class="flex flex-col items-center justify-center gap-stack-sm min-w-[88px] h-[88px] bg-surface-container-low text-on-surface-variant border border-surface-variant rounded-[16px] snap-center shrink-0 hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] shrink-0">local_fire_department</span>
<span class="font-label-lg text-label-lg text-center break-words w-full px-1">Pożar</span>
</button>
<button class="flex flex-col items-center justify-center gap-stack-sm min-w-[88px] h-[88px] bg-surface-container-low text-on-surface-variant border border-surface-variant rounded-[16px] snap-center shrink-0 hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] shrink-0">tsunami</span>
<span class="font-label-lg text-label-lg text-center break-words w-full px-1">Powódź</span>
</button>
</div>
</section>
<!-- Location Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-title-lg text-title-lg text-on-surface px-1">Lokalizacja</h2>
<div class="relative w-full h-40 rounded-[16px] overflow-hidden bg-surface-container-highest border border-surface-variant">
<img alt="Map preview" class="w-full h-full object-cover" data-alt="A clean, minimalist digital map interface showing a modern European residential area. The map uses a very light gray and white color scheme to match the app's light mode aesthetic. The streets are clearly delineated with soft geometric lines. A vibrant red location pin stands out sharply against the neutral background." data-location="Warsaw" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRecS8Bo6KdmFzUmZfCqRMEFvN1mCzOsWPnzpkgoQ2xwL3YpHw4YCf-vr0SY8__o6kI8hzxtklUNB8loR1Z09D9gMuOLnDmzyfVmhH8YjOjAdTrCaUSjTFV-Rkp16ZYmZfpx3421P7TPFN46Up7vER4ekuVD3HdHW_9UhuIF19FP2M0e9OGVzSX3OXbT1r-ayFpJ41YI5FkrWlex9oaFCf3e4O56nyy78VJXMWdZT9fc1S1EnSaKuN85woZyqgqCqETT_ju_FdKx4"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative">
<span class="material-symbols-outlined text-[40px] text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-1 bg-black/20 rounded-full blur-[2px]"></div>
</div>
</div>
</div>
<div class="flex justify-between items-center px-1 mt-1">
<span class="font-body-md text-body-md text-on-surface-variant">ul. Przykładowa 12, Warszawa</span>
<button class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors">Dostosuj lokalizację</button>
</div>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-stack-md">
<!-- Single-line text field -->
<div class="flex flex-col gap-1">
<label class="font-label-lg text-label-lg text-on-surface-variant px-1" for="alert-title">Tytuł zagrożenia</label>
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-[12px] px-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="alert-title" placeholder="Krótki tytuł..." type="text" value="Zderzenie dwóch aut"/>
</div>
<!-- Multi-line text area -->
<div class="flex flex-col gap-1">
<label class="font-label-lg text-label-lg text-on-surface-variant px-1" for="alert-desc">Opis (opcjonalne)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-[12px] p-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-none" id="alert-desc" placeholder="Podaj więcej szczegółów..." rows="3"></textarea>
</div>
<!-- Add Photo Button -->
<button class="flex items-center justify-center gap-2 h-14 w-full bg-surface-container-low text-on-surface border border-dashed border-outline-variant rounded-[12px] hover:bg-surface-container transition-colors mt-2 active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface-variant">photo_camera</span>
<span class="font-label-lg text-label-lg">Dodaj zdjęcie</span>
</button>
</section>
<!-- Slider / Duration -->
<section class="flex flex-col gap-stack-md pb-stack-lg">
<div class="flex justify-between items-center px-1">
<label class="font-title-lg text-title-lg text-on-surface">Jak długo alert ma być aktywny?</label>
<span class="font-body-lg text-body-lg text-primary font-medium">3h</span>
</div>
<div class="px-2 py-4">
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="3" min="0" step="1" type="range" value="1"/>
<div class="flex justify-between font-label-lg text-label-lg text-on-surface-variant mt-2 px-1">
<span>1h</span>
<span>3h</span>
<span>12h</span>
<span>24h</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<div class="p-margin-mobile bg-surface border-t border-surface-variant pb-8">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-headline-md text-[16px] flex items-center justify-center shadow-md hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98] duration-150">
                Opublikuj zgłoszenie
            </button>
</div>
</div>
</body></html>

<body class="bg-surface text-on-surface min-h-screen relative overflow-hidden font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Immersive Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center" data-alt="A breathtaking, wide-angle shot of a misty mountain range at dawn. The light is soft and diffused, creating a serene and premium light-mode aesthetic. The colors are dominated by warm, pale oranges and soft whites, perfectly complementing the interface's primary brand colors. The atmosphere is adventurous yet highly refined and safe.">
</div>
<div class="absolute inset-0 bg-surface/85 backdrop-blur-3xl"></div>
</div>
<!-- Task Header (Overrides TopAppBar for Focus) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/50 backdrop-blur-xl border-b border-white/20">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant transition-colors text-on-surface active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Edytuj profil</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 pt-24 pb-32 px-margin-mobile h-screen overflow-y-auto overflow-x-hidden flex flex-col gap-stack-lg max-w-lg mx-auto">
<!-- Interactive Avatar Section -->
<section class="flex flex-col items-center justify-center mt-stack-md">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-300">
<div class="w-32 h-32 rounded-full overflow-hidden shadow-[0_8px_30px_rgba(153,71,0,0.15)] border-4 border-surface-container-lowest relative z-10">
<img alt="Profile picture" class="w-full h-full object-cover group-hover:blur-sm transition-all duration-300" data-alt="A high-quality portrait of a confident, sophisticated traveler looking slightly off-camera. The lighting is soft, natural daylight that highlights their features against a bright, airy background. The overall mood is modern, approachable, and aligns with a premium lifestyle brand. Warm skin tones match the primary color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkMlBKNAMy84aF9Z-jvCdWw8Tx4G02tu-ju6BvmFRYWKkPLkzxrw1lIj1YGpoorKZ9g0nm2vPDF0M6EFQrYxrGJPqDh6ssABV51JFSu8yxsjyYqcYzdrAbU1qSPE5HQeiknqkodJ45aHo7gu74HzdzEM_llZHEVB3dX_p4p7XMzzF-luZ5e_-DgPegNujkOGAEJG2Q1YkrdB1GKAdAhn0uekVVCUfmu9ramPjEGMKbgxU7FlVdtHWbBSixhHs9yrmpb9cH1Rs0VnY"/>
<!-- Hover/Edit Overlay -->
<div class="absolute inset-0 bg-inverse-surface/40 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-surface-container-lowest" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<!-- Interactive Badge -->
<div class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-2 border-surface z-20">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
</div>
</div>
<span class="mt-stack-sm font-label-bold text-label-bold text-primary cursor-pointer hover:underline">Zmień zdjęcie</span>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-stack-md">
<!-- Name Input -->
<div class="flex flex-col relative group">
<label class="absolute top-2 left-4 font-label-sm text-label-sm text-on-surface-variant transition-all" for="nameInput">Imię i nazwisko</label>
<input class="w-full bg-surface-variant/50 backdrop-blur-md rounded-t-lg border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-4 pt-7 pb-2 font-body-lg text-body-lg text-on-surface transition-colors placeholder-on-surface-variant/50 outline-none" id="nameInput" type="text" value="Alex Vance"/>
</div>
<!-- Email Input (Contextual Addition for realism) -->
<div class="flex flex-col relative group">
<label class="absolute top-2 left-4 font-label-sm text-label-sm text-on-surface-variant transition-all" for="emailInput">Adres e-mail</label>
<input class="w-full bg-surface-variant/50 backdrop-blur-md rounded-t-lg border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-4 pt-7 pb-2 font-body-lg text-body-lg text-on-surface transition-colors placeholder-on-surface-variant/50 outline-none" id="emailInput" type="email" value="alex.vance@example.com"/>
</div>
</section>
<!-- Editable Menu Items (Bento Style Cards) -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-bold text-label-bold text-on-surface-variant px-2 uppercase tracking-wider mb-2">Konfiguracja</h2>
<!-- Family Groups -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest/80 backdrop-blur-md rounded-xl shadow-sm border border-white/50 hover:bg-surface-container-highest transition-colors group active:scale-[0.98] duration-200">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="diversity_3" style="font-variation-settings: 'FILL' 1;">diversity_3</span>
</div>
<div class="flex flex-col items-start">
<span class="font-label-bold text-label-bold text-on-surface">Grupy rodzinne</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">2 aktywne grupy</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="edit">edit</span>
</button>
<!-- Settings -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest/80 backdrop-blur-md rounded-xl shadow-sm border border-white/50 hover:bg-surface-container-highest transition-colors group active:scale-[0.98] duration-200">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
<div class="flex flex-col items-start">
<span class="font-label-bold text-label-bold text-on-surface">Ustawienia</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Powiadomienia, prywatność</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="edit">edit</span>
</button>
</section>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-surface via-surface/90 to-transparent z-50 flex gap-4 pb-safe">
<button class="flex-1 py-4 px-6 rounded-full font-label-bold text-label-bold text-primary bg-primary/10 hover:bg-primary/20 active:scale-95 transition-all duration-200 border border-primary/20">
            Anuluj
        </button>
<button class="flex-1 py-4 px-6 rounded-full font-label-bold text-label-bold text-on-primary bg-primary shadow-[0_8px_20px_rgba(153,71,0,0.3)] hover:shadow-[0_12px_25px_rgba(153,71,0,0.4)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
            Zapisz
        </button>
</div>

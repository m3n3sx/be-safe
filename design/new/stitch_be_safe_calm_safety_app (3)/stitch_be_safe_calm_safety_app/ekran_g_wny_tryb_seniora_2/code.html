<!DOCTYPE html>

<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#fcf8f9",
                    "surface-container": "#f0eded",
                    "on-surface": "#1c1b1c",
                    "secondary-fixed-dim": "#81d7b0",
                    "primary-fixed-dim": "#c1c7d0",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#fcf8f9",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#eae7e8",
                    "on-tertiary-fixed": "#410007",
                    "on-tertiary-container": "#db5f60",
                    "on-secondary-container": "#0f7252",
                    "on-primary-container": "#828790",
                    "tertiary-container": "#480008",
                    "error": "#ba1a1a",
                    "secondary-container": "#9df4cb",
                    "tertiary-fixed-dim": "#ffb3b1",
                    "outline-variant": "#c5c6cb",
                    "on-background": "#1c1b1c",
                    "on-tertiary-fixed-variant": "#862026",
                    "primary-fixed": "#dde3ed",
                    "surface-dim": "#dcd9da",
                    "on-surface-variant": "#44474b",
                    "inverse-surface": "#313031",
                    "tertiary-fixed": "#ffdad8",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#c1c7d0",
                    "background": "#fcf8f9",
                    "surface-variant": "#e5e2e2",
                    "on-secondary-fixed": "#002115",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#161c23",
                    "on-secondary-fixed-variant": "#005138",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f6f3f3",
                    "surface-tint": "#595f67",
                    "tertiary": "#190001",
                    "inverse-on-surface": "#f3f0f0",
                    "surface-container-highest": "#e5e2e2",
                    "outline": "#75777b",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#9df4cb",
                    "secondary": "#006c4c",
                    "primary": "#03080e",
                    "primary-container": "#1a2027",
                    "on-primary-fixed-variant": "#41474f",
                    "coral-emergency": "#FF7A7A",
                    "aqua-doctor": "#9EEBEC"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-margin": "48px",
                    "container-padding": "24px",
                    "unit": "8px",
                    "card-gap": "20px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-caps": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-hero": ["Inter"],
                    "display-md": ["Inter"],
                    "label-button": ["Inter"],
                    "headline-hero-mobile": ["Inter"],
                    "body-main": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["80px", {"lineHeight": "96px", "letterSpacing": "-0.04em", "fontWeight": "100"}],
                    "headline-hero": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "300"}],
                    "display-md": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "200"}],
                    "label-button": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-hero-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                    "body-main": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            font-size: 32px;
        }
        .senior-shadow {
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen pb-32">
<!-- Top Bar -->
<header class="bg-surface/80 backdrop-blur-xl sticky top-0 z-40 h-24 flex items-center justify-between px-container-padding w-full max-w-7xl mx-auto">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">DZIEŃ DOBRY</span>
<span class="font-headline-hero-mobile text-headline-hero-mobile text-primary">Jadwiga</span>
</div>
<button aria-label="Powiadomienia" class="w-14 h-14 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
</header>
<main class="px-container-padding space-y-6 max-w-lg mx-auto">
<!-- Status Card -->
<section class="bg-surface-container-lowest p-8 rounded-[24px] senior-shadow space-y-6">
<div class="flex">
<div class="inline-flex items-center gap-2 bg-secondary-container px-4 py-2 rounded-full">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-caps text-label-caps text-on-secondary-container">WSZYSTKO W PORZĄDKU</span>
</div>
</div>
<div class="space-y-1">
<h2 class="text-[22px] font-medium text-primary leading-tight">Twoja okolica jest bezpieczna</h2>
<p class="text-[16px] text-on-surface-variant">Ostatnia aktualizacja: 14:32</p>
</div>
<button class="w-full h-20 bg-primary-container text-on-primary rounded-2xl flex items-center justify-center gap-3 active:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-on-primary">check_circle</span>
<span class="text-[18px] font-semibold">ZAMELDUJ SIĘ</span>
</button>
</section>
<!-- Action Buttons Cluster -->
<nav class="space-y-4">
<!-- SOS -->
<button class="w-full h-[88px] bg-coral-emergency rounded-[20px] flex items-center p-5 gap-4 senior-shadow active:scale-[0.98] transition-transform">
<div class="w-14 h-14 bg-white rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-coral-emergency">local_hospital</span>
</div>
<div class="flex flex-col items-start text-white">
<span class="text-[20px] font-bold leading-none">WEZWIJ POMOC</span>
<span class="text-[14px] opacity-90">Naciśnij gdy potrzebujesz</span>
</div>
</button>
<!-- Family -->
<button class="w-full h-[88px] bg-surface-container-lowest border-2 border-surface-container-high rounded-[20px] flex items-center p-5 gap-4 active:bg-surface-container transition-colors">
<div class="w-14 h-14 bg-secondary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">family_restroom</span>
</div>
<div class="flex flex-col items-start text-primary">
<span class="text-[20px] font-bold leading-none">MOJA RODZINA</span>
<span class="text-[14px] text-on-surface-variant">Anna, Tomek</span>
</div>
</button>
<!-- Doctor -->
<button class="w-full h-[88px] bg-surface-container-lowest border-2 border-surface-container-high rounded-[20px] flex items-center p-5 gap-4 active:bg-surface-container transition-colors">
<div class="w-14 h-14 bg-aqua-doctor rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed-variant">phone_in_talk</span>
</div>
<div class="flex flex-col items-start text-primary">
<span class="text-[20px] font-bold leading-none">TELEFON DO LEKARZA</span>
<span class="text-[14px] text-on-surface-variant">dr Kowalska</span>
</div>
</button>
<!-- Guide -->
<button class="w-full h-[88px] bg-surface-container-lowest border-2 border-surface-container-high rounded-[20px] flex items-center p-5 gap-4 active:bg-surface-container transition-colors">
<div class="w-14 h-14 bg-tertiary-fixed rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">menu_book</span>
</div>
<div class="flex flex-col items-start text-primary">
<span class="text-[20px] font-bold leading-none">PORADNIK BEZPIECZEŃSTWA</span>
<span class="text-[14px] text-on-surface-variant">12 wskazówek</span>
</div>
</button>
</nav>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 h-24 bg-surface-container-lowest border-t border-surface-container-high flex justify-around items-center z-50">
<!-- Start (Active) -->
<button class="flex flex-col items-center justify-center w-1/4 h-full relative group">
<span class="material-symbols-outlined text-primary mb-1" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="text-[14px] font-medium text-primary">Start</span>
<div class="absolute bottom-4 w-8 h-1 bg-secondary rounded-full"></div>
</button>
<!-- Family -->
<button class="flex flex-col items-center justify-center w-1/4 h-full text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">group</span>
<span class="text-[14px] font-medium">Rodzina</span>
</button>
<!-- Help -->
<button class="flex flex-col items-center justify-center w-1/4 h-full text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">emergency</span>
<span class="text-[14px] font-medium">Pomoc</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center w-1/4 h-full text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="text-[14px] font-medium">Ustawienia</span>
</button>
</nav>
</body></html>

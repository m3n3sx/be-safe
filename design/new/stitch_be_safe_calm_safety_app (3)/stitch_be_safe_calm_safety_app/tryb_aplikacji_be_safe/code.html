        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;

            top: -100px;
            right: -100px;
        }

<body class="bg-background text-on-background font-body-main selection:bg-secondary-container">
<!-- Decorative Glow Orb -->
<div class="glass-orb"></div>
<main class="min-h-screen flex flex-col items-center px-container-padding pb-section-margin pt-16 max-w-[480px] mx-auto">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-10 w-full">
<img alt="be:Safe" class="h-11 mb-8 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ugrhGjFZ2NzzFdlV7Ts3UesEzeSXfoXXTPVv7XkNPxAfQGhlsX_YjwHRJVFFhyV-kFYW1eZ73Lnvlz1zekIFmKHtkozbXrVQ2MhjnTJH1rWAWhKSss44fFseGolUsgMOL69plN4NMUVM9R1USwVC0APJAhCLr7z9LQyIy3-5eAVhKiKxR_XrNcSsdvqr0E79nVTNfVHKufla53nEy6JN1EQLAdxFwElEXtKGZNc0NZ3DgsIIaLW-ldxDA"/>
<h1 class="font-headline-hero-mobile text-headline-hero-mobile text-primary tracking-[-0.5px] mb-2">Wybierz tryb</h1>
<p class="text-on-surface-variant font-body-main text-label-button">Możesz to zmienić w dowolnym momencie</p>
</header>
<!-- Mode Cards Stack -->
<section class="flex flex-col gap-card-gap w-full mb-12">
<!-- Card 1: Dla dziecka -->
<button class="flex items-start text-left bg-surface-container-lowest p-6 rounded-[24px] shadow-[0_8px_24px_rgba(26,32,39,0.06)] hover:translate-y-[-2px] transition-transform duration-300 group">
<div class="flex-shrink-0 w-[64px] h-[64px] rounded-full flex items-center justify-center bg-gradient-to-br from-[#9DF4CB] to-[#9EEBEC] mr-5">
<span class="material-symbols-outlined text-white text-[32px]">child_friendly</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-headline-hero-mobile text-[20px] font-semibold text-primary mb-2">Dla dziecka</h3>
<p class="text-on-surface-variant text-[14px] leading-relaxed mb-4">Duże kafelki, krótkie napisy, max 4 akcje. Wielki czerwony przycisk SOS. Bez ustawień i ukrytych funkcji.</p>
<span class="inline-flex items-center px-3 py-1 bg-surface-container-low text-on-surface-variant text-[10px] font-bold tracking-wider uppercase rounded-full">
                        POLECANE DLA: 7–12 lat
                    </span>
</div>
<div class="flex-shrink-0 self-center">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</div>
</button>
<!-- Card 2: Dla seniora -->
<button class="flex items-start text-left bg-surface-container-lowest p-6 rounded-[24px] shadow-[0_8px_24px_rgba(26,32,39,0.06)] hover:translate-y-[-2px] transition-transform duration-300 group">
<div class="flex-shrink-0 w-[64px] h-[64px] rounded-full flex items-center justify-center bg-primary-container mr-5">
<span class="material-symbols-outlined text-white text-[32px]">elderly</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-headline-hero-mobile text-[20px] font-semibold text-primary mb-2">Dla seniora</h3>
<p class="text-on-surface-variant text-[14px] leading-relaxed mb-4">Duża czcionka, wysokie kontrasty, sound + haptic feedback. Codzienny check-in. Numery alarmowe zawsze pod ręką.</p>
<span class="inline-flex items-center px-3 py-1 bg-surface-container-low text-on-surface-variant text-[10px] font-bold tracking-wider uppercase rounded-full">
                        POLECANE DLA: 60+
                    </span>
</div>
<div class="flex-shrink-0 self-center">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</div>
</button>
<!-- Card 3: Standardowy -->
<button class="flex items-start text-left bg-surface-container-lowest p-6 rounded-[24px] shadow-[0_8px_24px_rgba(26,32,39,0.06)] hover:translate-y-[-2px] transition-transform duration-300 group">
<div class="flex-shrink-0 w-[64px] h-[64px] rounded-full flex items-center justify-center bg-[#FF7A7A] mr-5">
<span class="material-symbols-outlined text-white text-[32px]">shield</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-headline-hero-mobile text-[20px] font-semibold text-primary mb-2">Standardowy</h3>
<p class="text-on-surface-variant text-[14px] leading-relaxed mb-4">Pełna funkcjonalność: mapa, alerty, rodzina, statystyki, SOS, czat sąsiedzki. Wszystkie ustawienia dostępne.</p>
<span class="inline-flex items-center px-3 py-1 bg-surface-container-low text-on-surface-variant text-[10px] font-bold tracking-wider uppercase rounded-full">
                        POLECANE DLA: 13–59 lat
                    </span>
</div>
<div class="flex-shrink-0 self-center">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</div>
</button>
</section>
<!-- Footer Actions -->
<footer class="mt-auto w-full flex flex-col items-center">
<button class="text-on-surface-variant text-[13px] font-medium underline mb-6 hover:text-primary transition-colors">
                Pomiń wybór — zdecyduję później
            </button>
<div class="inline-flex items-center px-4 py-2 border border-outline-variant bg-surface rounded-full">
<span class="text-outline-variant text-[11px] font-medium text-center">
                    Wybór możesz zmienić w Ustawienia → Tryb aplikacji
                </span>
</div>
</footer>

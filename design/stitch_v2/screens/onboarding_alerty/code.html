<!-- Hero Title -->
<div class="text-center w-full mb-section-margin">

<div class="absolute inset-0 bg-surface-container-low opacity-50" style="background-image: radial-gradient(#c5c6cb 1px, transparent 1px); background-size: 20px 20px;"></div>

<div class="w-1.5 h-1.5 rounded-full bg-on-primary"></div>
</div>
<!-- Danger Alert (Coral Glow Dot) -->
<div class="absolute top-1/3 right-1/3 w-3 h-3 rounded-full bg-on-tertiary-container glow-orb"></div>
</div>
<!-- Subtitle -->
<div class="text-center w-full mb-section-margin">

</div>

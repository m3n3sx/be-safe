<body class="bg-background text-on-background min-h-screen flex flex-col relative pb-[100px]">
<!-- TopAppBar -->
<header class="bg-transparent text-primary dark:text-inverse-primary docked full-width top-0 bg-transparent flat no shadows text-primary dark:text-inverse-primary hover:opacity-80 transition-opacity transition-all duration-300 ease-in-out flex items-center justify-between px-container-padding py-4 w-full sticky z-10 glass-panel">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined font-light text-[24px]">chevron_left</span>
</button>
<h1 class="font-body-main text-body-main font-medium absolute left-1/2 -translate-x-1/2">Zgłoś zagrożenie</h1>
<div class="w-10"></div> <!-- Spacer -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding pt-6 space-y-section-margin overflow-y-auto">
<!-- Kategoria Section -->
<section class="space-y-4">
<h2 class="font-label-caps text-label-caps text-on-surface-variant">Kategoria</h2>
<div class="flex space-x-3 overflow-x-auto hide-scrollbar pb-4 -mx-container-padding px-container-padding">
<!-- Selected Chip -->
<button class="flex-none flex items-center space-x-2 bg-surface-container-lowest rounded-full px-5 py-[10px] h-[40px] shadow-glow-mint scale-[1.02] transition-transform border border-secondary-fixed/30">
<span class="material-symbols-outlined text-[18px] text-secondary">warning</span>
<span class="font-body-main text-[14px] font-normal text-on-background">Zagrożenie</span>
</button>
<!-- Inactive Chips -->
<button class="flex-none flex items-center space-x-2 bg-surface-container-lowest rounded-full px-5 py-[10px] h-[40px] shadow-[0_4px_12px_rgba(26,32,39,0.03)] opacity-70">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">pets</span>
<span class="font-body-main text-[14px] font-normal text-on-surface-variant">Zwierzę</span>
</button>
<button class="flex-none flex items-center space-x-2 bg-surface-container-lowest rounded-full px-5 py-[10px] h-[40px] shadow-[0_4px_12px_rgba(26,32,39,0.03)] opacity-70">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">construction</span>
<span class="font-body-main text-[14px] font-normal text-on-surface-variant">Utrudnienie</span>
</button>
<button class="flex-none flex items-center space-x-2 bg-surface-container-lowest rounded-full px-5 py-[10px] h-[40px] shadow-[0_4px_12px_rgba(26,32,39,0.03)] opacity-70">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">group</span>
<span class="font-body-main text-[14px] font-normal text-on-surface-variant">Grupa</span>
</button>
</div>
</section>
<!-- Lokalizacja Section -->
<section class="space-y-4">
<h2 class="font-label-caps text-label-caps text-on-surface-variant">Lokalizacja</h2>

<span class="material-symbols-outlined text-on-tertiary-fixed-variant" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
</div>
<div class="flex items-center space-x-2 px-2 text-on-surface-variant">
<span class="font-body-main text-[12px] font-normal">ul. Marszałkowska 123 · 15 m</span>

<span class="material-symbols-outlined text-[14px]">edit</span>
</button>
</div>
</section>

<label class="font-label-caps text-label-caps text-on-surface-variant block px-2">Opis (opcjonalne)</label>

<div class="absolute bottom-4 right-2 font-label-caps text-[10px] text-on-surface-variant/60">0/500</div>

</section>

<div class="absolute top-1/2 left-4 right-4 h-[2px] bg-surface-dim -translate-y-1/2 rounded-full"></div>

<div class="flex flex-col items-center space-y-3 cursor-pointer">
<div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
<span class="font-body-main text-[12px] font-normal text-on-surface-variant">1h</span>
</div>
<div class="flex flex-col items-center space-y-3 cursor-pointer relative">

<div class="absolute top-[-5px] w-4 h-4 rounded-full bg-secondary shadow-[0_2px_8px_rgba(0,108,76,0.3)]"></div>

</div>
</div>
</div>
<div class="text-center mt-6">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Dog head -->
      <path d="M18 20 L14 8 L22 16" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M46 20 L50 8 L42 16" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
      <ellipse cx="32" cy="26" rx="16" ry="14" fill="#1a1a1a"/>
      <!-- Eyes -->
      <circle cx="26" cy="22" r="3" fill="#84CC16"/>
      <circle cx="38" cy="22" r="3" fill="#84CC16"/>
      <circle cx="26" cy="22" r="1.5" fill="white"/>
      <circle cx="38" cy="22" r="1.5" fill="white"/>
      <!-- Snout & teeth -->
      <ellipse cx="32" cy="32" rx="8" ry="6" fill="#333"/>
      <circle cx="32" cy="30" r="3" fill="#555"/>
      <!-- Teeth -->
      <polygon points="26,34 28,38 30,34" fill="white"/>
      <polygon points="34,34 36,38 38,34" fill="white"/>
      <polygon points="30,35 32,40 34,35" fill="white"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#84CC16"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- School building -->
      <rect x="12" y="22" width="40" height="26" fill="#1a1a1a"/>
      <!-- Roof -->
      <path d="M8 22 L32 8 L56 22" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Door -->
      <rect x="28" y="34" width="8" height="14" rx="1" fill="#7C3AED" opacity="0.7"/>
      <!-- Windows -->
      <rect x="16" y="28" width="8" height="8" rx="1" fill="#7C3AED" opacity="0.4"/>
      <rect x="40" y="28" width="8" height="8" rx="1" fill="#7C3AED" opacity="0.4"/>
      <!-- Flag/Bell -->
      <line x1="32" y1="8" x2="32" y2="4" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="32" y="2" width="8" height="5" fill="#7C3AED"/>
      <!-- Warning diamond -->
      <polygon points="32,12 36,16 32,20 28,16" fill="#7C3AED" opacity="0.6"/>
      <text x="32" y="18" text-anchor="middle" font-size="6" fill="white" font-weight="bold">!</text>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#7C3AED"/>
    </g>
  </g>
</svg>
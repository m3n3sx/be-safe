<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Barrier -->
      <rect x="6" y="20" width="52" height="24" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
      <!-- Diagonal stripes -->
      <path d="M6 20 L22 44 M14 20 L30 44 M22 20 L38 44 M30 20 L46 44 M38 20 L54 44 M46 20 L58 44" stroke="#F59E0B" stroke-width="4"/>
      <rect x="6" y="20" width="52" height="24" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
      <!-- Posts -->
      <rect x="10" y="44" width="4" height="6" fill="#1a1a1a"/>
      <rect x="50" y="44" width="4" height="6" fill="#1a1a1a"/>
      <!-- Warning light -->
      <circle cx="32" cy="12" r="6" fill="#F59E0B"/>
      <circle cx="32" cy="12" r="3" fill="white" opacity="0.6"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#F59E0B"/>
    </g>
  </g>
</svg>
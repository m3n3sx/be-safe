<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Car body -->
      <rect x="8" y="26" width="48" height="16" rx="4" fill="#1a1a1a"/>
      <path d="M14 26 L20 16 L44 16 L50 26" fill="#333" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Wheels -->
      <circle cx="18" cy="44" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
      <circle cx="46" cy="44" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
      <!-- Light bar -->
      <rect x="24" y="10" width="16" height="6" rx="3" fill="#2563EB"/>
      <rect x="24" y="10" width="8" height="6" rx="3" fill="#2563EB"/>
      <rect x="32" y="10" width="8" height="6" rx="3" fill="#DC2626"/>
      <!-- Flash lines -->
      <line x1="22" y1="8" x2="18" y2="4" stroke="#2563EB" stroke-width="2"/>
      <line x1="42" y1="8" x2="46" y2="4" stroke="#DC2626" stroke-width="2"/>
      <line x1="32" y1="8" x2="32" y2="4" stroke="white" stroke-width="1.5"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#2563EB"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Shadowy figure -->
      <circle cx="20" cy="14" r="8" fill="#1a1a1a"/>
      <path d="M12 22 L12 42 M12 28 L6 36 M12 28 L20 36" stroke="#1a1a1a" stroke-width="3"/>
      <!-- Reaching hand -->
      <path d="M20 28 L32 24" stroke="#1a1a1a" stroke-width="3"/>
      <!-- Child figure -->
      <circle cx="46" cy="20" r="6" fill="#E11D48" opacity="0.8"/>
      <path d="M46 26 L46 40 M46 32 L40 38 M46 32 L52 38 M46 40 L42 50 M46 40 L50 50" stroke="#E11D48" stroke-width="2.5"/>
      <!-- Warning circle -->
      <circle cx="32" cy="32" r="28" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#E11D48"/>
    </g>
  </g>
</svg>
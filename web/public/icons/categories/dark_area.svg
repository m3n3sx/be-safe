<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Dark background circle -->
      <circle cx="32" cy="28" r="24" fill="#1a1a1a"/>
      <!-- Broken streetlight -->
      <rect x="30" y="8" width="4" height="28" fill="#555"/>
      <path d="M24 8 L40 8 L38 14 L26 14 Z" fill="#6B7280" opacity="0.5"/>
      <!-- Broken bulb - X -->
      <line x1="28" y1="10" x2="36" y2="14" stroke="#6B7280" stroke-width="2.5"/>
      <line x1="36" y1="10" x2="28" y2="14" stroke="#6B7280" stroke-width="2.5"/>
      <!-- Moon -->
      <path d="M46 10 C42 10 40 14 40 18 C40 22 42 26 46 26 C42 24 40 20 42 16 C44 12 46 10 46 10Z" fill="#555"/>
      <!-- Eyes in dark -->
      <circle cx="18" cy="38" r="2" fill="#6B7280"/>
      <circle cx="24" cy="38" r="2" fill="#6B7280"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#6B7280"/>
    </g>
  </g>
</svg>
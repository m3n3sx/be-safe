<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Warning triangle -->
      <path d="M32 6 L4 50 L60 50 Z" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <path d="M32 12 L8 48 L56 48 Z" fill="#A3A3A3" opacity="0.15"/>
      <!-- Exclamation mark -->
      <rect x="29" y="20" width="6" height="16" rx="3" fill="#1a1a1a"/>
      <circle cx="32" cy="42" r="3.5" fill="#1a1a1a"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#A3A3A3"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Road -->
      <rect x="0" y="36" width="64" height="16" fill="#333"/>
      <line x1="0" y1="44" x2="12" y2="44" stroke="white" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="20" y1="44" x2="44" y2="44" stroke="white" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="52" y1="44" x2="64" y2="44" stroke="white" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Car approaching -->
      <rect x="4" y="36" width="20" height="10" rx="3" fill="#1a1a1a"/>
      <circle cx="8" cy="48" r="3" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
      <circle cx="20" cy="48" r="3" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
      <!-- Speed lines -->
      <line x1="26" y1="38" x2="30" y2="38" stroke="#EA580C" stroke-width="2"/>
      <line x1="26" y1="42" x2="32" y2="42" stroke="#EA580C" stroke-width="2"/>
      <!-- Child on road -->
      <circle cx="44" cy="28" r="5" fill="#EA580C"/>
      <path d="M44 33 L44 42 M44 36 L40 40 M44 36 L48 40" stroke="#EA580C" stroke-width="2.5"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#EA580C"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="white"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Syringe -->
      <rect x="10" y="28" width="30" height="8" rx="2" fill="#1a1a1a"/>
      <rect x="12" y="30" width="20" height="4" fill="#8B5CF6" opacity="0.6"/>
      <line x1="40" y1="32" x2="48" y2="32" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="48" y1="32" x2="52" y2="32" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="6" y1="30" x2="10" y2="30" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="6" y1="34" x2="10" y2="34" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Plunger lines -->
      <line x1="18" y1="28" x2="18" y2="36" stroke="#555" stroke-width="1"/>
      <line x1="24" y1="28" x2="24" y2="36" stroke="#555" stroke-width="1"/>
      <line x1="30" y1="28" x2="30" y2="36" stroke="#555" stroke-width="1"/>
      <!-- Pill -->
      <ellipse cx="44" cy="16" rx="8" ry="5" fill="#8B5CF6"/>
      <line x1="44" y1="11" x2="44" y2="21" stroke="white" stroke-width="1" opacity="0.4"/>
      <!-- Skull & crossbones hint -->
      <circle cx="22" cy="14" r="6" fill="#1a1a1a"/>
      <circle cx="20" cy="13" r="1.5" fill="#8B5CF6"/>
      <circle cx="24" cy="13" r="1.5" fill="#8B5CF6"/>
      <path d="M19 17 L25 17" stroke="#8B5CF6" stroke-width="1.5"/>
      <!-- Bottom bar -->
      <rect x="12" y="54" width="40" height="4" rx="2" fill="#8B5CF6"/>
    </g>
  </g>
</svg>